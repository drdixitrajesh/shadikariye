plugins { id 'com.android.application' }
android {
 namespace 'org.softinator.vedikmilan'
 compileSdk 36
 defaultConfig { applicationId 'org.softinator.vedikmilan'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.0.0' }
 signingConfigs { release {
  if (System.getenv('VEDIK_KEYSTORE')) { storeFile file(System.getenv('VEDIK_KEYSTORE')); storePassword System.getenv('VEDIK_STORE_PASSWORD'); keyAlias 'vedik-milan'; keyPassword System.getenv('VEDIK_STORE_PASSWORD') }
 } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4' }
